# =============================================================================
# SnakeMergeAnnotation — config.yaml
# =============================================================================

# -----------
# PATHS
# -----------
paths:
  fasta_dir:  "/path/to/your/genomes"       # directory with .fasta files
  output_dir: "/path/to/your/output"        # all outputs go here

# -----------
# GENERAL
# -----------
general:
  threads: 8                                # used by all tools (set to your CPU count)

# -----------
# RESOURCES
# -----------
resources:
  mem_mb:   16000                           # memory per job in MB
  max_jobs: 2                               # max parallel jobs

# -----------
# BAKTA
# -----------
bakta:
  docker_image: "engbio/bakta:v1"
  db_path:      "/path/to/databases/bakta_db/db-light"
  genus:        ""                          # optional
  species:      ""                          # optional
  gram:         "?"                         # + or - or ? (unknown)
  translation_table: 11

# -----------
# PROKKA
# -----------
prokka:
  docker_image: "engbio/prokka:v1"
  genus:        ""                          # optional
  kingdom:      "Bacteria"
  gcode:        11

# -----------
# DFAST
# -----------
dfast:
  docker_image: "engbio/dfast:v1"
  db_path:      "/path/to/databases/dfast_db"

# -----------
# PATRIC
# -----------
patric:
  docker_image:         "engbio/patric:v1"
  username:             "your@email.com"   # BV-BRC account
  password:             "your_password"
  taxonomy_id:          "1883"             # e.g. 1883 = Streptomyces
  description:          "Annotation via BV-BRC"
  workspace_output_dir: "my_annotations"
  monitor_interval:     60                 # seconds between status checks

# -----------
# MERGE
# -----------
merge:
  docker_image: "engbio/merge:v1"
  min_pident:   95.0                       # minimum BLASTp identity %
  min_qcov:     0.9                        # minimum query coverage (0-1)
  jobs:         2                          # organisms processed in parallel

# -----------
# EGGNOG
# -----------
eggnog:
  docker_image: "quay.io/biocontainers/eggnog-mapper:2.1.13--pyhdfd78af_1"
  db_path:      "/path/to/databases/eggnog"   # directory with eggnog.db, eggnog_proteins.dmnd, etc.
  sensmode:     "diamond"                      # diamond | mmseqs | hmmer
