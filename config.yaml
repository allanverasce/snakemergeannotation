  output_dir: /home/allan/projeto/input/results
general:
  threads: 20
resources:
  mem_mb: 20000
  max_jobs: 2
bakta:
  enabled: true
  docker_image: engbio/bakta:v1
  db_path: /home/allan/projeto/databases/db-light
  db_type: light
  genus: Streptomyces
  species: Streptomyces
