paths:
  fasta_dir: <inputPath>
  output_dir: <outputPath>
general:
  threads: 20
  dir_mode: '0775'
resources:
  mem_mb: 20000
  max_jobs: 2
  per_rule:
    annotate_dfast: 18g
    run_eggnog: 18g
container_runtime: docker
apptainer:
  extra_flags: []
  sif:
    bakta: null
    prokka: null
    dfast: null
    patric: null
    merge: null
    eggnog: null
docker:
  shm_size: 2g
  log_opts: true
  log_max_size: 10m
  disable_swap: true
  map_host_user: auto
  extra_flags: []
watchdog:
  max_retries: 4
  inactivity_timeout: 90m
  max_runtime: 0s
  check_interval: 120s
  cpu_threshold: 1.0
  grace: 120s
  per_rule:
    annotate_bakta:
      inactivity_timeout: 90m
    annotate_prokka:
      inactivity_timeout: 90m
    annotate_dfast:
      inactivity_timeout: 90m
    annotate_patric:
      inactivity_timeout: 60m
      max_runtime: 96h
    extract_cds:
      inactivity_timeout: 30m
    run_eggnog:
      inactivity_timeout: 240m
      check_interval: 180s
    annotate_pgap:
      inactivity_timeout: 300m
      check_interval: 180s
    run_merge:
      inactivity_timeout: 240m
      check_interval: 180s
bakta:
  enabled: true
  docker_image: engbio/bakta:v1
  db_path: <pathDatabase>/db-light
  db_type: light
  genus: Streptomyces
  species: Streptomyces
  strain: Streptomyces
  gram: '-'
  translation_table: 11
  min_contig_length: 100
  compliant: false
prokka:
  enabled: true
  docker_image: engbio/prokka:v1
  genus: Streptomyces
  kingdom: Bacteria
  gcode: 11
dfast:
  enabled: true
  docker_image: engbio/dfast:v1
  db_path: <pathDatabase>/dfast_db
  organism: unknown
  gcode: 11
patric:
  enabled: true
  docker_image: engbio/patric:v1
  username: username
  password: password
  taxonomy_id: 1883
  description: Bacteria
  workspace_output_dir: home
  monitor_interval: 60
eggnog:
  enabled: true
  docker_image: engbio/eggnog:v2.1.15
  db_path: <pathDatabase>/eggnog_data
  sensmode: diamond
pgap:
  enabled: true
  script_path: pgap.py
  mem: 18g
  cpus: 18
  extra_args: --ignore-all-errors
  species: Streptomyces
merge:
  docker_image: engbio/merge:v1
  min_pident: 95
  min_qcov: 0.9
  jobs: 2
  #tool_order: bakta,prokka,dfast,pgap,eggnog
base_tool: patric
mode: genomic
