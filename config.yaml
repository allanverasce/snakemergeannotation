  enabled: true
  docker_image: engbio/dfast:v1
  db_path: /home/allan/projeto/databases/dfast_db
  organism: Streptomyces
patric:
  enabled: false
  docker_image: engbio/patric:v1
  username: allanverasce
  password: '@biotec100'
  taxonomy_id: 1883
  description: Bacteria
  workspace_output_dir: home
  monitor_interval: 60
eggnog:
  enabled: false
  docker_image: quay.io/biocontainers/eggnog-mapper:2.1.13--pyhdfd78af_1
  db_path: /home/allan/projeto/databases/eggnog_data
  sensmode: diamond
